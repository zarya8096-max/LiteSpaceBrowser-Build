name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/LiteSpaceBrowser-debug.apk
          cd output
          sha256sum LiteSpaceBrowser-debug.apk > SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteSpaceBrowser-APK
          path: output/
          retention-days: 14

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.5.0-build-${{ github.run_number }}" \
            output/LiteSpaceBrowser-debug.apk \
            output/SHA256SUMS.txt \
            --title "LiteSpace Browser v2.5.0 (Build ${{ github.run_number }})" \
            --notes "Automated CI Build for LiteSpace Browser v2.5.0."
